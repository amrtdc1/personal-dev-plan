name: Vercel Preview Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview URL to smoke test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-preview:
    name: Smoke Preview Deployment
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.ref != 'main'
      )
    defaults:
      run:
        working-directory: pdp-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pdp-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve preview URL
        id: preview
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            preview_url="${{ github.event.inputs.preview_url }}"
          else
            preview_url="${{ github.event.deployment_status.environment_url }}"
            if [[ -z "$preview_url" ]]; then
              preview_url="${{ github.event.deployment_status.target_url }}"
            fi
          fi

          if [[ -z "$preview_url" ]]; then
            echo "Preview URL was empty; skipping smoke run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Resolved preview URL: $preview_url"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Run smoke check
        if: steps.preview.outputs.should_run == 'true'
        run: npm run smoke:preview -- "${{ steps.preview.outputs.url }}"
